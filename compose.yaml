services:
  postgres:
    image: postgres:17-alpine
    container_name: slothub-postgres
    environment:
      POSTGRES_DB: slothub
      POSTGRES_USER: slothub
      POSTGRES_PASSWORD: slothub
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slothub -d slothub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
