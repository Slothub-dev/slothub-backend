name: Баг
description: Что-то работает не так, как должно
labels: ["type:bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Коротко — что сломано.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи, запросы, ответы
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Окружение
      options:
        - production
        - staging
        - local
    validations:
      required: true
